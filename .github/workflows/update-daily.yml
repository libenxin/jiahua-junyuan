name: Daily Data Update

on:
  schedule:
    # 08:00 Beijing time (UTC+8) = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node supabase/update-today.js

      - name: Create deployment zip
        run: |
          zip -r jiahua-junyuan-web.zip assets _shared supabase *.html *.md
          ls -lh jiahua-junyuan-web.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiahua-junyuan-web
          path: jiahua-junyuan-web.zip
          retention-days: 90

      - name: Commit updated project data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/project-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update project data $(date -u +%Y-%m-%d)"
            git push
          fi
